version: 2

# Grouped updates keep pull request noise down, as the Defra standards recommend.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    # neostandard, the lint rules, only supports ESLint 9. Remove this when a
    # neostandard release supports ESLint 10, or npm ci fails and so does CI.
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
